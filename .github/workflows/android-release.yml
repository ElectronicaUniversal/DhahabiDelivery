name: Android Release Build

on:
  push:
    branches: [ "main", "fix/delivery-app" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [ self-hosted, dhahabi-vps ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore ./DhahabiDelivery/DhahabiDelivery.csproj

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ./dhahabi-delivery.keystore

      - name: Publish Android AAB
        run: >
          dotnet publish ./DhahabiDelivery/DhahabiDelivery.csproj
          -f net9.0-android35.0 -c Release
          -p:AndroidPackageFormat=aab
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ github.workspace }}/dhahabi-delivery.keystore
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}
          -o ./publish-aab /p:TreatWarningsAsErrors=false

      - name: Publish Android APK
        run: >
          dotnet publish ./DhahabiDelivery/DhahabiDelivery.csproj
          -f net9.0-android35.0 -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ github.workspace }}/dhahabi-delivery.keystore
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}
          -o ./publish-apk /p:TreatWarningsAsErrors=false

      - name: Remove keystore from runner
        if: always()
        run: rm -f ./dhahabi-delivery.keystore

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhahabiDelivery-AAB
          path: ./publish-aab/**/*-Signed.aab
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhahabiDelivery-APK
          path: ./publish-apk/**/*-Signed.apk
          if-no-files-found: warn

      # Publica el APK en cdn.dhahabi.ae (descarga pública real para usuarios).
      # Solo corre cuando el workflow se dispara manualmente (Run workflow en GitHub
      # Actions), nunca en un push normal a fix/delivery-app -- esa rama se usa para
      # iterar y probar cosas, y un push de prueba no debe sobreescribir lo que
      # descargan usuarios reales.
      - name: Publicar APK en cdn.dhahabi.ae
        if: github.event_name == 'workflow_dispatch'
        run: |
          APK_PATH=$(find ./publish-apk -name "*-Signed.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No se encontró el APK firmado en ./publish-apk"
            exit 1
          fi
          docker cp "$APK_PATH" minio-minio-1:/tmp/Dhahabi.apk
          docker exec minio-minio-1 mc alias set local http://localhost:9000 minio "${{ secrets.MINIO_ROOT_PASSWORD }}"
          docker exec minio-minio-1 mc cp /tmp/Dhahabi.apk local/apk/android/Dhahabi.apk
          docker exec minio-minio-1 rm /tmp/Dhahabi.apk
          echo "APK publicado en https://cdn.dhahabi.ae/apk/android/Dhahabi.apk"
